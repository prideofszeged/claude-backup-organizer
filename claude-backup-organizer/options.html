
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="options">
  <header>
    <h2>Claude Library</h2>
    <div class="right">
      <button id="popOutLibrary" title="Open library in persistent window">📤 Pop Out</button>
      <div class="sync-controls">
        <button id="syncInc">Sync</button>
        <button id="syncFull" title="Force re-download">Full</button>
        <button id="syncTest" title="Test connection">Test</button>
        <button id="syncStop" title="Stop sync">Stop</button>
      </div>
      <div class="advanced-controls">
        <button id="sqlQuery" title="SQL Query">SQL</button>
        <button id="refreshLibrary" title="Refresh">🔄</button>
        <button id="exportIndex" title="Export Index JSON">Index</button>
        <button id="exportAll" title="Export All Chats JSON">All JSON</button>
        <button id="exportCsv" title="Export CSV">CSV</button>
        <button id="deleteSettings" title="Delete Settings">⚙️</button>
        <label class="importBtn" title="Import Index">📁<input id="importFile" type="file" accept="application/json" hidden></label>
        <label class="download-checkbox"><input type="checkbox" id="downloadDuringSync"/> Save files</label>
      </div>
    </div>
  </header>

  <div id="status" class="status" style="display:none"></div>
  
  <!-- Sync Progress Section -->
  <div id="syncProgress" class="sync-progress" style="display:none">
    <div class="progress-header">
      <span id="syncStatusText">Syncing...</span>
      <span id="syncProgressText">0/0</span>
    </div>
    <div class="progress-bar">
      <div id="progressFill" class="progress-fill"></div>
    </div>
    <div id="syncDetails" class="sync-details"></div>
  </div>

  <section class="controls">
    <input id="q" placeholder="Search title / tags / notes" />
    <select id="sortBy">
      <option value="updated-desc">Updated (newest first)</option>
      <option value="updated-asc">Updated (oldest first)</option>
      <option value="title-asc">Title A-Z</option>
      <option value="title-desc">Title Z-A</option>
    </select>
    <button id="bulkOperations">Bulk Actions</button>
  </section>

  <div class="main-content">
    <aside class="folder-tree">
      <div class="tree-header">
        <h3>Folders</h3>
        <button id="addFolder" class="small-btn">+</button>
      </div>
      <div id="folderTree" class="tree"></div>
    </aside>
    
    <main class="conversation-list">
      <div class="list-header">
        <span id="conversationCount">0 conversations</span>
        <div id="selectionToolbar" style="display:none; gap:8px;">
          <span id="selectionCount" style="color: var(--muted); font-size: 13px;"></span>
          <button id="quickDelete" class="small-btn" style="background: #dc3545;">Delete</button>
          <button id="clearSelection" class="small-btn">Clear</button>
        </div>
        <button id="selectAll">Select All</button>
      </div>
      <div id="conversationGrid" class="conversation-grid"></div>
    </main>
  </div>

  <!-- Bulk Operations Modal -->
  <div id="bulkModal" class="modal" style="display:none">
    <div class="modal-content">
      <h3>Bulk Actions</h3>
      <div class="bulk-actions">
        <button id="bulkMoveToFolder">Move to Folder</button>
        <button id="bulkAddTags">Add Tags</button>
        <button id="bulkRemoveTags">Remove Tags</button>
        <button id="bulkExport">Export Selected</button>
      </div>
      
      <div class="bulk-delete-section">
        <h4>Delete Options</h4>
        <div class="delete-mode-selection">
          <label>
            <input type="radio" name="bulkDeleteMode" value="local" checked>
            Remove from library only (can re-sync)
          </label>
          <label>
            <input type="radio" name="bulkDeleteMode" value="web">
            Delete from Claude.ai permanently ⚠️
          </label>
        </div>
        <button id="bulkDeleteExecute" class="bulk-delete-btn">Delete Selected</button>
      </div>
      
      <button id="closeBulkModal">Close</button>
    </div>
  </div>

  <!-- Tag Management Modal -->
  <div id="tagModal" class="modal" style="display:none">
    <div class="modal-content">
      <h3>Manage Tags</h3>
      <div id="tagList" class="tag-management"></div>
      <div class="new-tag">
        <input id="newTagName" placeholder="Tag name" />
        <input id="newTagColor" type="color" value="#61dafb" />
        <button id="addTag">Add Tag</button>
      </div>
      <button id="closeTagModal">Close</button>
    </div>
  </div>

  <!-- Conversation Viewer Modal -->
  <div id="conversationModal" class="conversation-modal" style="display:none">
    <div class="modal-backdrop"></div>
    <div class="conversation-modal-content">
      <div class="conversation-modal-header">
        <div class="modal-title-section">
          <h2 id="modalConversationTitle">Conversation</h2>
          <div class="modal-navigation">
            <button id="prevConversation" class="nav-btn" title="Previous conversation">←</button>
            <span id="conversationPosition" class="position-indicator">1 of 10</span>
            <button id="nextConversation" class="nav-btn" title="Next conversation">→</button>
          </div>
        </div>
        <div class="modal-controls">
          <select id="modalViewMode" class="modal-view-select">
            <option value="raw">Raw View</option>
            <option value="rendered">Rendered</option>
            <option value="markdown">Markdown</option>
          </select>
          <button id="modalExportMd" class="modal-btn" title="Export Markdown">📤 Export</button>
          <button id="toggleFullscreen" class="modal-btn" title="Toggle fullscreen">⛶</button>
          <button id="closeConversationModal" class="modal-close" title="Close">✕</button>
        </div>
      </div>
      <div class="conversation-modal-body">
        <article id="modalRaw" class="modal-raw-view"></article>
        <article id="modalRendered" class="modal-rendered" style="display:none"></article>
        <textarea id="modalMarkdown" class="modal-markdown" style="display:none"></textarea>
      </div>
    </div>
  </div>

  <!-- Delete Settings Modal -->
  <div id="deleteSettingsModal" class="modal" style="display:none">
    <div class="modal-content">
      <h3>🗑️ Deletion Settings</h3>
      
      <div class="settings-section">
        <h4>Default Behavior</h4>
        <div class="setting-options">
          <label>
            <input type="radio" name="deleteMode" value="local-only">
            <strong>Remove from library only</strong> (safe, reversible via sync)
          </label>
          <label>
            <input type="radio" name="deleteMode" value="web-confirm">
            <strong>Ask me each time</strong> (choose local vs web deletion)
          </label>
          <label>
            <input type="radio" name="deleteMode" value="web-default">
            <strong>Delete from Claude.ai by default</strong> (permanent)
          </label>
        </div>
      </div>
      
      <div class="settings-section">
        <h4>Safety Features</h4>
        <div class="setting-checkboxes">
          <label>
            <input type="checkbox" id="showExportReminder">
            Show export reminder before permanent deletion
          </label>
          <label>
            <input type="checkbox" id="confirmBulkDeletes">
            Confirm bulk deletions individually
          </label>
        </div>
      </div>
      
      <div class="settings-actions">
        <button id="saveDeleteSettings">Save Settings</button>
        <button id="closeDeleteSettings">Cancel</button>
      </div>
    </div>
  </div>

  <section class="debug">
    <div class="row">
      <label><input type="checkbox" id="debugToggle"/> Show debug log</label>
      <button id="debugClear" title="Clear debug log">Clear</button>
    </div>
    <pre id="debugLog" style="display:none"></pre>
  </section>

  <script src="options.js"></script>
</body>
</html>
